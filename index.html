<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/b84b868441.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>GitHub Card</title>
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <div class="content">
                <div class="header">
                    <div class="header-logo">devfinder</div>
                    <div class="theme">
                        <div class="theme-text">light</div>
                        <div class="theme-icon">
                            <img src="img/sun.svg" alt="">
                        </div>
                    </div>
                </div>
                <div class="search-bar">
                    <div class="search-icon">
                        <img src="img/search.svg" alt="">
                    </div>
                    <div class="search-input"><input type="text" placeholder="Search GitHub username…"></div>
                    <div class="search-btn"><button>Search</button></div>
                </div>
                <div class="profile-section">
                    <div class="profile-avatar">
                        <img src="img/avatar.png" alt="">
                    </div>
                    <div class="profile-info">
                        <div class="user-info">
                            <div class="name-info">
                                <div class="username">The Octocat</div>
                                <div class="tag">@octocat</div>
                            </div>
                            <div class="signup-info">Joined 25 Jan 2011</div>
                        </div>
                        <div class="bio">This profile has no bio</div>
                        <div class="stats">
                            <div class="stat">
                                <div class="stat-name">Repos</div>
                                <div class="stat-value">8</div>
                            </div>
                            <div class="stat">
                                <div class="stat-name">Followers</div>
                                <div class="stat-value">3938</div>
                            </div>
                            <div class="stat">
                                <div class="stat-name">Following</div>
                                <div class="stat-value">9</div>
                            </div>
                        </div>
                        <div class="links">
                            <div class="location">
                                <div class="location-icon icon">
                                    <img src="img/location.svg" alt="">
                                </div>
                                <div class="location-name">San Francisco</div>
                            </div>
                            <div class="social">
                                <div class="social-icon icon">
                                    <img src="img/twitter.svg" alt="">
                                </div>
                                <div class="social-name">Not Available</div>
                            </div>
                            <div class="url">
                                <div class="url-icon icon">
                                    <img src="img/url.svg" alt="">
                                </div>
                                <div class="url-name"><a href="#">https://github.blog</a></div>
                            </div>
                            <div class="company">
                                <div class="company-icon icon">
                                    <img src="img/company.svg" alt="">
                                </div>
                                <div class="company-name">@github</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
